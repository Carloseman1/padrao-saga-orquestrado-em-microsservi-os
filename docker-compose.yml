services:

  pedido-db:
    image: mongo:7
    container_name: pedido-db
    restart: always
    networks:
      - livraria-saga
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: 123456
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 12

  validacao-livro-db:
    image: postgres:16-alpine
    container_name: validacao-livro-db
    networks:
      - livraria-saga
    environment:
      POSTGRES_DB: validacao-livro-db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d validacao-livro-db"]
      interval: 5s
      timeout: 3s
      retries: 12

  pagamento-db:
    image: postgres:16-alpine
    container_name: pagamento-db
    networks:
      - livraria-saga
    environment:
      POSTGRES_DB: pagamento-db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pagamento-db"]
      interval: 5s
      timeout: 3s
      retries: 12

  estoque-db:
    image: postgres:16-alpine
    container_name: estoque-db
    networks:
      - livraria-saga
    environment:
      POSTGRES_DB: estoque-db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d estoque-db"]
      interval: 5s
      timeout: 3s
      retries: 12

  usuario-db:
    image: postgres:16-alpine
    container_name: usuario-db
    networks:
      - livraria-saga
    environment:
      POSTGRES_DB: usuario-db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d usuario-db"]
      interval: 5s
      timeout: 3s
      retries: 12

  kafka:
    image: obsidiandynamics/kafka
    container_name: kafka
    restart: "no"
    ports:
      - "2181:2181"
      - "9092:9092"
    networks:
      - livraria-saga
    environment:
      KAFKA_LISTENERS: "INTERNAL://:29092,EXTERNAL://:9092"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:29092,EXTERNAL://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_ZOOKEEPER_SESSION_TIMEOUT: "6000"
      KAFKA_RESTART_ATTEMPTS: "10"
      KAFKA_RESTART_DELAY: "5"
      ZOOKEEPER_AUTOPURGE_PURGE_INTERVAL: "0"
    volumes:
      - ./data/kafka/data:/var/lib/kafka/data

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v2.3.8
    container_name: redpanda
    restart: on-failure
    entrypoint: /bin/sh
    command: -c "echo \"$$CONSOLE_CONFIG_FILE\" > /tmp/config.yml; /app/console"
    ports:
      - "8081:8080"
    networks:
      - livraria-saga
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
      CONSOLE_CONFIG_FILE: |
        kafka:
          brokers: ["kafka:29092"]
    depends_on:
      - kafka

  mongo-express:
    image: mongo-express:1.0.2
    container_name: mongo-express
    restart: on-failure
    depends_on:
      pedido-db:
        condition: service_healthy
    networks:
      - livraria-saga
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://admin:123456@pedido-db:27017/
      ME_CONFIG_BASICAUTH: "false"
    ports:
      - "8082:8081"

  pedido-service:
    build: ./pedido-service
    container_name: pedido-service
    depends_on:
      pedido-db:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - livraria-saga
    environment:
      KAFKA_BROKER: kafka:29092
      MONGO_DB_URI: mongodb://admin:123456@pedido-db:27017
    ports:
      - "3000:3000"

  orquestrador-service:
    build: ./orquestrador-service
    container_name: orquestrador-service
    depends_on:
      - kafka
    networks:
      - livraria-saga
    environment:
      KAFKA_BROKER: kafka:29092
    ports:
      - "8080:8080"

  validacao-livro-service:
    build: ./validacao-livro-service
    container_name: validacao-livro-service
    depends_on:
      validacao-livro-db:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - livraria-saga
    environment:
      KAFKA_BROKER: kafka:29092
      DB_HOST: validacao-livro-db
      DB_PORT: 5432
      DB_NAME: validacao-livro-db
      DB_USER: postgres
      DB_PASSWORD: postgres
    ports:
      - "8090:8090"

  pagamento-service:
    build: ./pagamento-service
    container_name: pagamento-service
    depends_on:
      pagamento-db:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - livraria-saga
    environment:
      KAFKA_BROKER: kafka:29092
      DB_HOST: pagamento-db
      DB_PORT: 5432
      DB_NAME: pagamento-db
      DB_USER: postgres
      DB_PASSWORD: postgres
    ports:
      - "8091:8091"

  estoque-service:
    build: ./estoque-service
    container_name: estoque-service
    depends_on:
      estoque-db:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - livraria-saga
    environment:
      KAFKA_BROKER: kafka:29092
      DB_HOST: estoque-db
      DB_PORT: 5432
      DB_NAME: estoque-db
      DB_USER: postgres
      DB_PASSWORD: postgres
    ports:
      - "8092:8092"

networks:
  livraria-saga:
    driver: bridge
