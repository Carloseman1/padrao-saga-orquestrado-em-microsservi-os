spring.application.name=fiscal-service

server.port=8094

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5436}/${DB_NAME:fiscal-db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.kafka.bootstrap-servers=${KAFKA_BROKER:localhost:9092}
spring.kafka.consumer.group-id=fiscal-group
spring.kafka.consumer.auto-offset-reset=latest

app.kafka.topico.orquestrador=orquestrador
app.kafka.topico.nfe-sucesso=nfe-sucesso
app.kafka.topico.nfe-falha=nfe-falha

logging.level.org.apache.kafka=OFF

app.outbox.intervalo-ms=${OUTBOX_INTERVALO_MS:500}
app.outbox.timeout-envio-ms=${OUTBOX_TIMEOUT_ENVIO_MS:5000}

app.emitente.uf=35
app.emitente.cnpj=11222333000181
app.emitente.serie=1

app.sefaz.livros-com-ncm-invalido=${SEFAZ_LIVROS_COM_NCM_INVALIDO:O_GUARANI}
