name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  testes:
    name: Testes (${{ matrix.servico }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        servico:
          - pedido-service
          - orquestrador-service
          - validacao-livro-service
          - pagamento-service
          - estoque-service
          - usuario-service
          - fiscal-service
    defaults:
      run:
        working-directory: ${{ matrix.servico }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: ${{ matrix.servico }}/pom.xml

      - name: Compila e roda os testes
        run: ./mvnw -B verify

      - name: Guarda o relatório dos testes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes-${{ matrix.servico }}
          path: ${{ matrix.servico }}/target/surefire-reports/

  compose:
    name: Valida o docker-compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker compose config --quiet