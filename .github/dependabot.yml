version: 2
updates:
  - package-ecosystem: maven
    directories:
      - /pedido-service
      - /orquestrador-service
      - /validacao-livro-service
      - /pagamento-service
      - /estoque-service
      - /usuario-service
    schedule:
      interval: weekly
    groups:
      dependencias-maven:
        patterns: ['*']

  - package-ecosystem: docker
    directories:
      - /pedido-service
      - /orquestrador-service
      - /validacao-livro-service
      - /pagamento-service
      - /estoque-service
      - /usuario-service
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly