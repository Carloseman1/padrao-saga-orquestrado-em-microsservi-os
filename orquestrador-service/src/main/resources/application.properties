spring.application.name=orquestrador-service

server.port=8080

spring.kafka.bootstrap-servers=${KAFKA_BROKER:localhost:9092}
spring.kafka.consumer.group-id=orquestrador-group
spring.kafka.consumer.auto-offset-reset=latest

app.kafka.topico.inicio-saga=inicio-saga
app.kafka.topico.orquestrador=orquestrador
app.kafka.topico.fim-sucesso=fim-sucesso
app.kafka.topico.fim-falha=fim-falha

logging.level.org.apache.kafka=OFF
