spring.application.name=estoque-service

server.port=8092

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:estoque-db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.kafka.bootstrap-servers=${KAFKA_BROKER:localhost:9092}
spring.kafka.consumer.group-id=estoque-group
spring.kafka.consumer.auto-offset-reset=latest

app.kafka.topico.orquestrador=orquestrador
app.kafka.topico.estoque-sucesso=estoque-sucesso
app.kafka.topico.estoque-falha=estoque-falha
app.kafka.topico.livro-cadastrado=livro-cadastrado

logging.level.org.apache.kafka=OFF

app.jwt.secret=${JWT_SECRET:segredo-de-desenvolvimento-da-livraria-trocar-em-producao}
app.sessao.cookie-nome=livraria_sessao

app.outbox.intervalo-ms=${OUTBOX_INTERVALO_MS:500}
app.outbox.timeout-envio-ms=${OUTBOX_TIMEOUT_ENVIO_MS:5000}
