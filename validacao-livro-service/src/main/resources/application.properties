spring.application.name=validacao-livro-service

server.port=8090

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:validacao-livro-db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.kafka.bootstrap-servers=${KAFKA_BROKER:localhost:9092}
spring.kafka.consumer.group-id=validacao-livro-group
spring.kafka.consumer.auto-offset-reset=latest

app.kafka.topico.orquestrador=orquestrador
app.kafka.topico.validacao-livro-sucesso=validacao-livro-sucesso
app.kafka.topico.validacao-livro-falha=validacao-livro-falha
app.kafka.topico.livro-cadastrado=livro-cadastrado

logging.level.org.apache.kafka=OFF
