spring.application.name=usuario-service

server.port=8093

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5435}/${DB_NAME:usuario-db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET:segredo-de-desenvolvimento-da-livraria-trocar-em-producao}
app.jwt.expiration-ms=3600000

app.sessao.cookie-nome=livraria_sessao
app.sessao.cookie-seguro=${SESSAO_COOKIE_SEGURO:false}

app.viacep.url=https://viacep.com.br/ws
app.viacep.connect-timeout-ms=3000
app.viacep.read-timeout-ms=5000

app.login.bloqueio-segundos=60
app.recuperacao.expiracao-minutos=30
