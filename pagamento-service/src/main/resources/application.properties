spring.application.name=pagamento-service

server.port=8091

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pagamento-db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.kafka.bootstrap-servers=${KAFKA_BROKER:localhost:9092}
spring.kafka.consumer.group-id=pagamento-group
spring.kafka.consumer.auto-offset-reset=latest

app.kafka.topico.orquestrador=orquestrador
app.kafka.topico.pagamento-sucesso=pagamento-sucesso
app.kafka.topico.pagamento-falha=pagamento-falha

logging.level.org.apache.kafka=OFF

app.jwt.secret=${JWT_SECRET:segredo-de-desenvolvimento-da-livraria-trocar-em-producao}
app.sessao.cookie-nome=livraria_sessao

app.cripto.chave=${CRIPTO_CHAVE:chave-de-desenvolvimento-da-livraria-trocar-em-producao}
app.cripto.salt=${CRIPTO_SALT:5c0744940b5c369b}
